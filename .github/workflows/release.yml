name: Release

# Pushing a tag like v1.0.0 builds the Windows installer and publishes it as a
# GitHub Release. The tag must match "version" in package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"
            exit 1
          fi

      - run: npm ci

      # vite build -> compile .jsc bytecode -> electron-builder NSIS installer
      - name: Build installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/DBAccess-Setup-*.exe \
            release/DBAccess-Setup-*.exe.blockmap \
            release/latest.yml \
            --title "DB Access ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Keep installer as a workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: DBAccess-Setup
          path: release/DBAccess-Setup-*.exe
