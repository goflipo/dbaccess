<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DB Access</title>
  <meta name="description" content="Professional database access tool for PostgreSQL and ClickHouse" />
</head>
<body>
  <script>
    // Apply saved theme before React renders to avoid flash
    try {
      var t = localStorage.getItem('dbaccess:theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
